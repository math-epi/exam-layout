<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>瀏覽器內編譯（實驗）— 考卷排版工作台</title>
<style>
body{margin:0;font:15px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:#F4F6FA;color:#1F2937}
header{background:#1E407C;color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
header .tag{background:#F59E0B;color:#1F2937;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
main{max-width:1100px;margin:14px auto;padding:0 14px}
.card{background:#fff;border:1px solid #D7DDE8;border-radius:10px;padding:12px 16px;margin-bottom:12px}
.btn{font:inherit;border:1px solid #1E407C;background:#fff;color:#1E407C;border-radius:8px;padding:6px 14px;cursor:pointer}
.btn.primary{background:#1E407C;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.on{background:#1E407C;color:#fff}
#bar{height:8px;background:#E5E9F2;border-radius:99px;overflow:hidden;margin:8px 0}
#bar i{display:block;height:100%;width:0;background:#2F6FDE;transition:width .3s}
#stat{font-weight:600}
#sub{color:#5B6577;font-size:13px}
iframe{width:100%;height:78vh;border:1px solid #D7DDE8;border-radius:8px;background:#fff}
pre{white-space:pre-wrap;word-break:break-all;background:#0F172A;color:#E2E8F0;padding:10px;border-radius:8px;max-height:50vh;overflow:auto;font-size:12px}
textarea{width:100%;height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;box-sizing:border-box}
.warn{color:#B45309}
</style>
</head>
<body>
<header><h1>編譯成 PDF</h1>
<span style="font-size:13px;opacity:.9">用 XeLaTeX（WebAssembly）直接在這台電腦的瀏覽器編譯，不需要 Overleaf，也不用連到任何伺服器。</span></header>
<main>
<div class="card">
  <div id="stat">準備中…</div>
  <div id="bar"><i></i></div>
  <div id="sub"></div>
  <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span style="font-size:13px;color:#5B6577">版本：</span><span id="vers" style="display:flex;gap:6px"></span>
    <button class="btn primary" id="btnGo" type="button" disabled>重新編譯</button>
    <a class="btn" id="btnDl" style="display:none;text-decoration:none">下載 PDF</a>
    <button class="btn" id="btnLog" type="button" style="display:none">看編譯記錄</button>
  </div>
</div>
<div class="card" id="srcCard" hidden>
  <details><summary style="cursor:pointer">main.tex（從工作台帶過來，可以直接改了再編譯）</summary><textarea id="tex" spellcheck="false"></textarea></details>
</div>
<div class="card" id="logCard" hidden><pre id="log"></pre></div>
<iframe id="pdf" hidden title="PDF 預覽"></iframe>
<footer style="font-size:12px;color:#5B6577;text-align:right;padding:8px 0 18px">本編譯頁使用 TeXlyre-BusyTeX，本頁程式依 <a href="../licenses/AGPL-3.0.txt" target="_blank" rel="noopener">AGPL-3.0-or-later</a> 提供，不附任何擔保。　<a href="https://github.com/math-epi/exam-layout" target="_blank" rel="noopener">原始碼</a>　·　<a href="../third-party.html" target="_blank" rel="noopener">第三方元件聲明</a></footer>
</main>
<script type="module">
import {BusyTexRunner,XeLatex} from './lib/index.js';
const $=id=>document.getElementById(id);
const base=new URL('.',location.href).href;
const stat=t=>{$('stat').textContent=t},sub=t=>{$('sub').textContent=t},bar=p=>{$('bar').firstElementChild.style.width=Math.max(0,Math.min(100,p))+'%'};
const SUPPORT=['xeCJK.sty','xeCJK.cfg','xeCJKfntef.sty','xunicode-addon.sty','xunicode-extra.def','ctexhook.sty'];
const FONTS=['NotoSerifTC-Regular.otf','NotoSansTC-Regular.otf','NotoSansTC-Bold.otf','STIXTwoMath-Regular.ttf'];
const FONT_SETUP=`  font-sans = {NotoSansTC-Regular.otf}, font-sans-bold = {NotoSansTC-Bold.otf},
  font-serif = {NotoSerifTC-Regular.otf}, font-serif-bold = {NotoSansTC-Bold.otf},
  font-latin = {texgyretermes-regular.otf}, font-math = {STIXTwoMath-Regular.ttf},
`;
function patchTex(t){
  // 拿掉工作台裡寫的系統字型名稱（瀏覽器內沒有系統字型），改用隨附字型檔
  t=t.replace(/^[ \t]*font-(?:sans-bold|sans|serif-bold|serif|latin|math)[ \t]*=[ \t]*\{[^}\n]*\},?[ \t]*\n/gm,'');
  t=t.replace('\\ExamSetup{','\\ExamSetup{\n'+FONT_SETUP);
  t=t.replace('\\begin{document}','\\setCJKmainfont{NotoSerifTC-Regular.otf}\\setCJKsansfont{NotoSansTC-Regular.otf}\n\\begin{document}');
  return t;
}
async function getBytes(url,label,done){
  const r=await fetch(url);if(!r.ok)throw new Error(label+' 下載失敗（'+r.status+'）');
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),parts=[];let got=0;
  for(;;){const {done:d,value}=await rd.read();if(d)break;parts.push(value);got+=value.length;done&&done(got,total);}
  const out=new Uint8Array(got);let p=0;for(const c of parts){out.set(c,p);p+=c.length;}return out;
}
let runner=null,files=null,cls=null,busy=false,pdfUrl=null,lastLog='';
function loadImgs(){return new Promise(res=>{try{const rq=indexedDB.open('exam_wasm',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onerror=()=>res([]);rq.onsuccess=()=>{const g=rq.result.transaction('kv').objectStore('kv').get('imgs');g.onsuccess=()=>{rq.result.close();res((g.result||[]).map(x=>({path:x.path,content:x.bytes})));};g.onerror=()=>res([]);};}catch(e){res([]);}});}
async function ensureEngine(){
  if(!runner){
    stat('正在載入編譯引擎…');sub('第一次使用要下載約 110 MB，之後會存在這台電腦的瀏覽器裡，不用再下載。');bar(8);
    runner=new BusyTexRunner({busytexBasePath:base+'busytex',preloadDataPackages:[base+'busytex/texlive-slim.js'],verbose:false});
    const t0=performance.now();const tick=setInterval(()=>sub('載入編譯引擎中… 已經 '+Math.round((performance.now()-t0)/1000)+' 秒（第一次比較久）'),1000);
    try{await runner.initialize(true);}finally{clearInterval(tick);}
    bar(55);
  }
  if(!files){
    files=[];let i=0;const all=[...SUPPORT,...FONTS];
    for(const n of all){
      stat('正在載入字型與套件（'+(i+1)+'／'+all.length+'）…');
      const b=await getBytes(base+'files/'+n,n,(g,t)=>sub(n+'　'+(g/1e6).toFixed(1)+(t?' / '+(t/1e6).toFixed(1):'')+' MB'));
      files.push({path:n,content:b});i++;bar(55+25*i/all.length);
    }
  }
  if(!cls){
    cls=localStorage.getItem('exam_wasm_cls');
    if(!cls){const r=await fetch('../examsheet.cls').catch(()=>null);if(r&&r.ok)cls=await r.text();}
    if(!cls)throw new Error('找不到 examsheet.cls。請回到工作台，從「列印 / 存檔」再按一次「在瀏覽器內編譯」。');
  }
}
async function go(){
  if(busy)return;busy=true;$('btnGo').disabled=true;$('logCard').hidden=true;$('btnLog').style.display='none';
  try{
    await ensureEngine();
    const src=patchTex($('tex').value);
    stat('編譯中…');sub('通常 10～30 秒。');bar(85);
    const t0=performance.now();
    const x=new XeLatex(runner);
    const r=await x.compile({input:src,additionalFiles:[{path:'examsheet.cls',content:cls},...files,...(await loadImgs())]});
    lastLog=r.log||'';
    const sec=((performance.now()-t0)/1000).toFixed(1);
    if(r.success&&r.pdf){
      if(pdfUrl)URL.revokeObjectURL(pdfUrl);
      pdfUrl=URL.createObjectURL(new Blob([r.pdf],{type:'application/pdf'}));
      $('pdf').src=pdfUrl;$('pdf').hidden=false;
      const dl=$('btnDl');dl.href=pdfUrl;dl.download='考卷.pdf';dl.style.display='';
      bar(100);stat('完成 ✓（編譯 '+sec+' 秒）');sub('PDF 檔 '+(r.pdf.length/1024).toFixed(0)+' KB。這是 XeLaTeX 編譯出來的，和 Overleaf 同一套排版引擎。'+(lastLog.includes('ExamEndNote: moved to next page')?'卷尾提醒放不下原本的最後一頁，已移到下一頁。':''));
    }else{
      bar(0);stat('編譯失敗');sub('展開「看編譯記錄」查看原因（通常是題目裡有 LaTeX 不認得的指令）。');
      $('pdf').hidden=true;
    }
    $('btnLog').style.display='';$('log').textContent=lastLog.slice(-20000);
  }catch(e){
    bar(0);stat('出錯了');sub(String(e&&e.message||e));console.error(e);
  }finally{busy=false;$('btnGo').disabled=false;}
}
$('btnGo').addEventListener('click',go);
$('btnLog').addEventListener('click',()=>{$('logCard').hidden=!$('logCard').hidden;});
const VN=[['student','學生版'],['answer','簡答版'],['solution','詳解版']];
let texs={},cur='student',has=false;
try{const raw=localStorage.getItem('exam_wasm_tex');if(raw){try{const o=JSON.parse(raw);texs=o.texs||{};cur=o.cur||'student';}catch(e){texs={student:raw};}}}catch(e){}
has=!!texs[cur]||Object.keys(texs).length>0;
if(has&&!texs[cur])cur=Object.keys(texs)[0];
const edited={};
function showVer(v){
  if(texs[cur]!==undefined)texs[cur]=$('tex').value;
  cur=v;$('tex').value=texs[v]||'';
  [...$('vers').children].forEach(b=>b.classList.toggle('on',b._v===v));
}
VN.forEach(([v,n])=>{const b=document.createElement('button');b.type='button';b.className='btn'+(v===cur?' on':'');b.textContent=n;b._v=v;b.disabled=!texs[v];
  b.addEventListener('click',()=>{if(busy||v===cur)return;showVer(v);go();});$('vers').append(b);});
$('tex').value=texs[cur]||'';$('srcCard').hidden=false;
if(has){go();}else{stat('沒有收到考卷內容');sub('請回到工作台，按「列印 / 存檔」，再按「在瀏覽器內編譯 PDF（實驗）」。也可以把 main.tex 貼到下面的框裡，按「重新編譯」。');$('btnGo').disabled=false;$('srcCard').querySelector('details').open=true;}
</script>
</body>
</html>
